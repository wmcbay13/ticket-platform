apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  sources:
  - repoURL: https://helm.cilium.io
    chart: cilium
    targetRevision: 1.20.2
    helm:
      releaseName: cilium
      valueFiles:
      - $values/deploy/platform/values/cilium.yaml
  - repoURL: https://github.com/wmcbay13/ticket-platform.git
    targetRevision: gitops-demo
    ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
---
