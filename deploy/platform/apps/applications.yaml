apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ticket-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: ticket
  source:
    repoURL: https://github.com/wmcbay13/ticket-platform.git
    targetRevision: gitops-demo
    path: deploy/app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
  - group: argoproj.io
    kind: Rollout
    name: booking
    jsonPointers:
    - /spec/replicas
  - group: apps
    kind: Deployment
    name: catalog
    jsonPointers:
    - /spec/replicas
  - group: ''
    kind: Service
    jqPathExpressions:
    - .spec.selector."rollouts-pod-template-hash"
  - group: traefik.io
    kind: TraefikService
    name: booking-traffic
    jqPathExpressions:
    - .spec.weighted.services[].weight
