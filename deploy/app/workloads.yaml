  name: booking
  namespace: ticket
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: booking
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: booking
  namespace: ticket
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: booking
  minReplicas: 2
  maxReplicas: 4
  metrics:
