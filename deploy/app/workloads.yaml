apiVersion: batch/v1
kind: Job
metadata:
  name: ticket-migrate
  namespace: ticket
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: '-1'
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app: migrate
        project: ticket-platform
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: migrate
        image: ticket-backend
        args:
        - -mode
        - migrate
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: app-auth
              key: admin_url
        - name: CATALOG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-auth
              key: catalog_password
        - name: BOOKING_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-auth
              key: booking_password
        - name: WORKER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-auth
              key: worker_password
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 300m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
