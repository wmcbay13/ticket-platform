apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: ticket
  labels:
    app: catalog
    project: ticket-platform
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: catalog
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: catalog
        project: ticket-platform
        metrics: ticket
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      tolerations:
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 30
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 30
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
        matchLabelKeys:
        - pod-template-hash
        labelSelector:
          matchLabels:
            app: catalog
      containers:
      - name: catalog
        image: ticket-backend
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        args:
        - -mode
        - catalog
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: app-auth
              key: catalog_url
        - name: APP_VERSION
          value: 44b6ce82a9fbe7265398267953083e97d4ca9579
        - name: DB_MAX_CONNS
          value: '5'
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: ticket
  labels:
    app: catalog
    project: ticket-platform
spec:
  selector:
    app: catalog
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: catalog
  namespace: ticket
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: catalog
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalog
  namespace: ticket
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: catalog
  minReplicas: 2
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: booking
  namespace: ticket
  labels:
    app: booking
    project: ticket-platform
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: booking
  strategy:
    canary:
      stableService: booking-stable
      canaryService: booking-canary
      maxSurge: 1
      maxUnavailable: 0
      trafficRouting:
        traefik:
          weightedTraefikServiceName: booking-traffic
      steps:
      - setWeight: 10
      - pause:
          duration: 2m
      - analysis:
          templates:
          - templateName: booking-quality
          args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
      - setWeight: 50
      - pause:
          duration: 2m
      - analysis:
          templates:
          - templateName: booking-quality
          args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
      - setWeight: 100
  template:
    metadata:
      labels:
        app: booking
        project: ticket-platform
        metrics: ticket
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      tolerations:
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 30
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 30
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
        matchLabelKeys:
        - rollouts-pod-template-hash
        labelSelector:
          matchLabels:
            app: booking
      containers:
      - name: booking
        image: ticket-backend
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        args:
        - -mode
        - booking
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: app-auth
              key: booking_url
        - name: APP_VERSION
          value: 44b6ce82a9fbe7265398267953083e97d4ca9579
        - name: DB_MAX_CONNS
          value: '5'
---
apiVersion: v1
kind: Service
metadata:
  name: booking-stable
  namespace: ticket
  labels:
    app: booking
    project: ticket-platform
spec:
  selector:
    app: booking
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: booking-canary
  namespace: ticket
  labels:
    app: booking
    project: ticket-platform
spec:
  selector:
    app: booking
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: policy/v1
