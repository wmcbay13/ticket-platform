apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: application-isolation
  namespace: ticket
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: ingress, app.kubernetes.io/name: traefik}
      toPorts:
        - ports: [{port: '8080', protocol: TCP}]
    - fromEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: monitoring, app.kubernetes.io/name: prometheus}
      toPorts:
        - ports: [{port: '8080', protocol: TCP}]
  egress:
    - toEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: kube-system, k8s:k8s-app: kube-dns}
      toPorts:
        - ports: [{port: '53', protocol: UDP}, {port: '53', protocol: TCP}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: service-database-access
  namespace: ticket
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
spec:
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [catalog, booking, worker, migrate]
  egress:
    - toEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: ticket-data, app: postgres}
      toPorts:
        - ports: [{port: '5432', protocol: TCP}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: database-isolation
  namespace: ticket-data
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: ticket}
          matchExpressions:
            - key: app
              operator: In
              values: [catalog, booking, worker, migrate]
      toPorts:
        - ports: [{port: '5432', protocol: TCP}]
  egress: []
