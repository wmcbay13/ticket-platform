apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - postgres.yaml
  - workloads.yaml
  - ingress.yaml
  - policies.yaml
  - monitoring.yaml
  - analysis.yaml
  - dashboard.yaml
images:
  - name: ticket-backend
    newName: ghcr.io/wmcbay13/ticket-platform-backend
    newTag: bootstrap
  - name: ticket-web
    newName: ghcr.io/wmcbay13/ticket-platform-web
    newTag: bootstrap
